apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-modelos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicio-modelos
  template:
    metadata:
      labels:
        app: servicio-modelos
    spec:
      containers:
      - name: modelos
        image: autolavado-modelos:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-modelos-svc
spec:
  selector:
    app: servicio-modelos
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: servicio-modelos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servicio-modelos
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
