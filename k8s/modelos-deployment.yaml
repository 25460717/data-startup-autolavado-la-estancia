apiVersion: apps/v1
kind: Deployment
metadata:
  name: autolavado-modelos
  labels:
    app: autolavado-modelos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autolavado-modelos
  template:
    metadata:
      labels:
        app: autolavado-modelos
    spec:
      containers:
      - name: modelos
        image: autolavado-modelos:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: autolavado-modelos-svc
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: autolavado-modelos
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autolavado-modelos-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autolavado-modelos
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
